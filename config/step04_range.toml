# Step 04: the opponent's predicted range and the hero's equity against it.
# Read by 04_predicted_range/run.py and examples.py with tomllib; a file passed with --config overrides any key it
# repeats. The values are research defaults, not tuned to any operator. [range] and prior.class_floor keep the
# whole posterior over the opponent's live combos, which is the best calibrated setting when every hole card is
# known. The narrow-setting values
# (a 240-combo cap, a relative prune, a class floor and live-combo weights) are in
# 04_predicted_range/variants/cap240.toml.

[fit]
# Fitting needs every actor's hole cards, folded hands included. A dataset whose hands are not all full-information
# (cards_visibility = 'full') is never fitted on: run step 04 on it with --fit-from <a full-information dataset>.
min_full_share = 1.0
# Key the preflop prior and the player tilts by the number of players dealt in (2 / 3-6 / 7+). Heads-up and
# six-handed opening ranges differ by a factor of two, so one table for both would misplace every heads-up range.
table_size_classes = true

[prior]
min_support = 30          # hands a prior cell needs before it is used; otherwise the next level is tried
class_floor = 0.0         # classes with a smaller prior weight are not expanded to combos (narrow setting 0.0008);
                          # a class with no hand in the prior cell is never expanded

[likelihood]
min_support = 25          # actions a likelihood cell needs before it is used; otherwise the next level is tried
eps = 1e-4                # Laplace term added to every action count, and again to every combo's update factor

[tilt]
loose_beta = 1.4          # exponent of the looseness tilt: weight x ratio^(beta * (0.5 - strength percentile))
loose_min_n = 15          # the looseness tilt needs at least this many postflop actions of the opponent
agg_min_n = 8             # the aggression tilt starts at this many postflop actions ...
agg_full_n = 50           # ... and reaches full weight here (linear ramp in between)
ratio_min = 0.5           # both tilts clip the player / field ratio to [ratio_min, ratio_max]
ratio_max = 2.0
clean_min_hands = 300     # field baselines: players with at least this many hands ...
clean_sigma = 3.0         # ... and VPIP and aggression within this many standard deviations of the mean

[tilt.bluff_exponent]     # exponent b of the aggression tilt per made-hand group: P(bet) x (agg ratio ^ b) ^ weight
monster = 0.0             # full_house_plus
strong = 0.05             # flush, straight, trips_set, two_pair, overpair
top_pair = 0.15           # top_pair_good, top_pair_weak
middle_pair = 0.45        # middle_pair
weak_pair = 0.8           # weak_pair, underpair
air = 1.0                 # nothing

[range]
cap = 1326                # combos kept, the heaviest ones; 1326 = no cap (narrow setting 240, which drops the
                          # opponent's real hand from many heads-up ranges)
prune_frac = 0.0          # combos lighter than this share of the heaviest combo are dropped first (narrow setting 2e-4)
prune_each_step = true    # true: floor the prior's classes and prune after the expansion and after every update;
                          # false: update all live combos, floor the classes and prune once at the end
combo_weight = "class_size" # a class's prior weight per combo: "class_size" divides by all 6 / 4 / 12 combos of
                          # the class (each combo's probability given the dead cards); "live_combos" (narrow setting) divides by
                          # the combos the hero's cards and the board leave, so a class the board blocks keeps its
                          # whole weight
sizing = true             # true: the opponent's bet and raise sizes narrow his range. Each of his bets and raises
                          # is read with the tier of its size (t1 < 40% of the pot <= t2 < 60% <= t3 < 90% <= t4
                          # < 110% <= t5) and each check or call with the tier of the bet he faced (rng_lik_size),
                          # so a river overbet keeps the hands that overbet, not every hand that bets.
                          # false: the size-blind model (rng_lik_post), a 33% bet and a 125% overbet read alike

[enrich]
tables = "hu"             # "hu": decisions at two-player tables (the hu_decisions view); "all": any table
max_live_opp = 1          # 1: heads-up pots only; 2 or 3 also scores multiway rows with Monte Carlo equity
streets = ["flop", "turn", "river"]
exact = true              # heads-up equity vs the range by enumeration on every street (false: Monte Carlo on the flop)
mc_samples = 4096         # Monte Carlo samples per multiway row (and per flop row when exact = false)
seed = 20010101           # seed of every Monte Carlo draw (each row derives its own from this and its ids)
procs = 8                 # worker processes (each holds about 0.8 GB; 16 hit a memory error on a busy 28 GB laptop)
chunk_decisions = 4000    # decisions per work unit (one parquet file in, one out)

[leakage]
streets = ["turn", "river"]   # decision set of the split: heads-up responses to a bet on these streets
dead_below = 0.02         # real class "dead": equity vs the real cards below this
win_from = 0.5            # real class "winning": equity vs the real cards at least this
bins = 10                 # range bins: least(bins - 1, floor(bins * eq_vs_range))

[examples]
dataset = "article_sample" # dataset the narrowing example is drawn from
hand_id = ""              # pinned example hand; "" = the first hand (by hand_id) that matches the pattern below
pattern = ["flop:bet", "turn:bet", "river:raise"]   # the opponent's postflop actions, in order
