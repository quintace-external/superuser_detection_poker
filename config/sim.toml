# Shared preflop tables (a regular's base ranges; styles scale them).
[sim.preflop]
rfi = { EP = 0.15, HJ = 0.19, CO = 0.27, BTN = 0.45, SB = 0.36, BB = 0.0 }
threebet_pos = { EP = 0.7, HJ = 0.8, CO = 0.9, BTN = 1.1, SB = 1.1, BB = 1.1 }
cold_call_pos = { EP = 0.6, HJ = 0.8, CO = 1.0, BTN = 1.3, SB = 0.6, BB = 1.0 }
standard_open = 2.5     # bb; calling widths assume this open size
size_power = 0.7        # widths shrink as (standard / size) ** size_power against bigger raises
threebet_ip = 3.0       # 3-bet to 3x the open in position ...
threebet_oop = 3.6      # ... and 3.6x out of position
fourbet_mult = 2.3      # 4-bet to 2.3x the 3-bet
shove_frac = 0.4        # a raise that commits more than 40% of the stack goes all-in
value_share = 0.6       # 60% of a 3-bet/4-bet range is value, the rest bluffs from just below the calls
squeeze_tighten = 0.8   # calling width x 0.8 per caller already in
size_round_bb = 0.1     # preflop raises are rounded to 0.1 bb
size_factor_clip = [0.15, 1.25]  # bounds of that shrink / stretch
sb_limp_mult = 1.6      # the small blind completes 1.6x wider than its style's limp width ...
sb_overlimp_mult = 1.8  # ... and over limpers 1.8x wider
bb_iso_multi = 0.7      # the big blind iso-raises 0.7x as wide against two or more limpers
limp_call_keep = 0.55   # a limper facing a raise calls with 55% of his limping range
cold_3bet_call = 1.5    # a caller or limper facing a 3-bet calls with 1.5 x call_4bet
fivebet_share = 0.35    # 35% of the 4-bet width moves all-in against a 4-bet
bluff_band_min = 0.05   # 3-bet bluffs come from a band at least 5% wide below the calls

# Shared postflop model: what a bettor is believed to hold, value thresholds, sizes.
[sim.postflop]
m_street = [0.61, 0.71, 0.76]   # believed h of a bettor's range on flop / turn / river ...
size_ref = 0.6                  # ... for a bet of 0.6 pot;
m_size = 0.06                   # + 0.06 per pot of size above that
m_raise = 0.10                  # + per raise on the street
m_barrel = 0.02                 # + per earlier street the same player bet
m_multi = 0.03                  # + per extra live opponent
width = 0.08                    # logistic scale from h to perceived equity
value_shift = [0.0, 0.07, 0.16] # value threshold shift on flop / turn / river
value_multi = 0.04              # value threshold + per extra opponent
bluff_multi = 0.5               # bluff probabilities x 0.5 per extra opponent
weak_h = 0.40                   # below this h a hand is air
medium_barrel = 0.25            # turn/river bluff probabilities x 0.25 for hands between air and value
implied = [0.01, 0.03, 0.05]    # call bonus to h for gutshot / open-ender or flush draw / combo draw (flop; half on the turn)
flop_mc_samples = 300           # Monte Carlo deals for h on the flop
size_grid = [0.33, 0.5, 0.75, 1.0, 1.5]
allin_snap = 0.15               # a bet leaving less than 15% of the stack behind goes all-in
bluff_raise = 0.5               # pure bluff raises: probability = bluff x this
m_hu = [-0.12, -0.16, -0.20]    # heads-up: ranges are wide, a bet is believed weaker (calls only) ...
value_hu = -0.03                # ... and value bets are thinner
strong_h = 0.9                  # h from which a hand is very strong (slow-plays, bigger sizes)
semibluff_raise = 0.25          # facing a bet, draws raise with probability semibluff x 0.25
size_cap = 2.0                  # bets above 2 pots count as 2 pots in the believed strength

# Informed rules of a planted superuser.
[sim.superuser]
call_margin = 0.02
raise_eq = 0.80
raise_prob = 0.5
value_eq = 0.60
bluff_eq = 0.30
bluff_opp_max = 0.45            # bluff only when every opponent's own h is below this
bluff_prob = 0.6
opp_strong = 0.60               # an opponent at least this strong will call a big value bet
value_size_strong = 1.0
value_size_weak = 0.5
bluff_size = 0.6
preflop_info = false

# HUD reads of a "reads" player: opponent class -> [bluff multiplier, value threshold shift, belief shift].
[sim.exploit]
tag = [1.0, 0.0, 0.0]
lag = [0.9, 0.0, -0.02]
nit = [1.4, 0.03, 0.05]
loose_passive = [0.4, -0.05, 0.04]
maniac = [0.6, -0.03, -0.06]
strong = [1.0, 0.0, 0.0]

# Targets of the honest field's pooled statistics (00_simulator/simulate.py --calibrate).
[sim.calibration]
pair_min_hands = 500            # a heads-up pair needs this many hands for the single-victim test
min_pairs = 40                  # sim_demo should have at least this many honest pairs
player_min_hands = 5000         # bb/100 spread is reported for players with at least this many hands

[sim.calibration.targets.ring]
VPIP = [24, 32]
PFR = [17, 23]
3bet = [6, 10]
flop_cbet = [50, 70]
fold_to_flop_cbet = [35, 55]
WTSD = [24, 32]
"W$SD" = [47, 54]
AF = [2, 4]

[sim.calibration.targets.hu]
VPIP = [60, 80]
PFR = [40, 65]
WTSD = [30, 42]
"W$SD" = [47, 54]
