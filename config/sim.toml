# Simulator settings: 00_simulator/simulate.py and sudetect/sim/*. Read with tomllib (sudetect.sim.population.load_sim_config).
# Amounts in big blinds unless a key says "units" (chip units, 100 units = 1 bb).
# h = a hand's equity against one random hand on the current board. Widths are fractions of all 1,326 combos,
# taken from the top of the preflop ranking.

[sim]
seed = 20010101
epoch = "2001-01-01T00:00:00Z"   # first simulated day (UTC); hands are stamped from here on
hand_id_base = 1000000            # hand numbers start at hand_id_base + 1
sb_units = 50
bb_units = 100
ante_bb = 0.0                     # no ante by default
rake_pct = 0.05                   # 5% of the pot ...
rake_cap_bb = 3.0                 # ... capped at 3 bb ...
no_flop_no_drop = true            # ... and only when a flop was dealt
hu_hand_share = 0.70              # share of table-hands dealt at heads-up tables (the rest at 6-max tables)
ring_seats = 6
buy_in_mix = [[100, 0.80], [40, 0.04], [60, 0.04], [150, 0.06], [200, 0.06]]  # [buy-in bb, share of players]
top_up_below = 0.5                # between hands, a stack below this share of the buy-in is topped up to it
unit_hands = 1500                 # hands per output file / parallel work unit (about)

[sim.datasets.sim_small]
n_players = 60
n_days = 20
target_hands = 20000
plants = ["SU_FULL_100", "SU_VICTIM_92", "SU_ONSET"]

[sim.datasets.sim_demo]
n_players = 300
n_days = 60
target_hands = 400000
plants = ["SU_FULL_100", "SU_FULL_050", "SU_FULL_025", "SU_VICTIM_92", "SU_VICTIM_50", "SU_VICTIM_20", "SU_ONSET"]

[sim.datasets.sim_pf]             # tables of any size: run with --preflop-info (05_detection/results/eval_preflop_flop.md)
n_players = 200
n_days = 40
target_hands = 200000
plants = ["SU_FULL_100", "SU_FULL_050", "SU_VICTIM_92", "SU_ONSET", "SU_RING_100", "SU_RING_050"]

[sim.datasets.custom]
n_players = 120
n_days = 20
target_hands = 50000
plants = ["SU_FULL_100", "SU_VICTIM_92", "SU_ONSET"]

# Planted superusers. kind: full_table (sees every opponent) | single_victim (sees one victim).
# u: share of the eligible postflop decisions played with the information.
# victim_share: share of the plant's heads-up hands played against the victim.
# from_day_frac: information starts at round(frac * n_days) (day 45 of 60).
# activity_quantile: the plant's volume is this quantile of everybody's activity distribution (typical volume).
# hu_pref: the plant's share of sessions started heads-up (omitted: drawn like everybody's).
[sim.plants.SU_FULL_100]
kind = "full_table"
activity_quantile = 0.6
hu_pref = 0.6
u = 1.0
from_day = 0

[sim.plants.SU_FULL_050]
kind = "full_table"
activity_quantile = 0.6
hu_pref = 0.6
u = 0.5
from_day = 0

[sim.plants.SU_FULL_025]
kind = "full_table"
activity_quantile = 0.6
hu_pref = 0.6
u = 0.25
from_day = 0

[sim.plants.SU_VICTIM_92]
kind = "single_victim"
activity_quantile = 0.6
hu_pref = 0.85
victim = "V1"
victim_share = 0.92
u = 1.0
from_day = 0

[sim.plants.SU_VICTIM_50]
kind = "single_victim"
activity_quantile = 0.6
hu_pref = 0.85
victim = "V2"
victim_share = 0.50
u = 1.0
from_day = 0

[sim.plants.SU_VICTIM_20]
kind = "single_victim"
activity_quantile = 0.8           # a busier player, so the 20% against the victim still gives a testable pair
hu_pref = 0.85
victim = "V3"
victim_share = 0.20
u = 1.0
from_day = 0

[sim.plants.SU_ONSET]
kind = "full_table"
activity_quantile = 0.6
hu_pref = 0.6
u = 1.0
from_day_frac = 0.75

[sim.plants.SU_RING_100]         # six-max only: invisible to a screen of two-player tables
kind = "full_table"
activity_quantile = 0.6
hu_pref = 0.0
u = 1.0
from_day = 0

[sim.plants.SU_RING_050]
kind = "full_table"
activity_quantile = 0.6
hu_pref = 0.0
u = 0.5
from_day = 0

[sim.schedule]
activity_sigma = 0.5              # lognormal spread of a player's mean sessions per day
hu_pref_mean = 0.45               # mean share of a player's sessions started heads-up (beta)
hu_pref_concentration = 4.0
rivals_per_player = 2             # preferred heads-up opponents per player
stickiness_mean = 0.75            # probability that a match a player starts is against a rival (beta)
stickiness_concentration = 8.0
hu_match_hands_mean = 70.0        # heads-up match length in hands (lognormal)
hu_match_hands_sigma = 0.6
hu_match_hands_min = 10
ring_table_hands = [120, 360]     # 6-max table session length in hands (uniform)
ring_stay_hands_mean = 90.0       # a player's stay at a 6-max table (geometric)
ring_refill_hands_mean = 3.0      # an empty 6-max seat waits this many hands for a new player (geometric)
ring_min_players = 3
hu_hand_seconds = [6.0, 2.5, 4.0]     # gap between hands: base + per decision * decisions + exponential(mean)
ring_hand_seconds = [10.0, 3.0, 6.0]

# Share of each archetype in the honest field.
[sim.mix]
tag = 0.30
lag = 0.15
nit = 0.10
loose_passive = 0.30
maniac = 0.05
strong = 0.10

# Per-player jitter of the archetype parameters: "relative" = lognormal sd applied to every number
# not listed; listed keys get an absolute gaussian sd instead.
[sim.jitter]
relative = 0.10
call_margin = 0.015
belief = 0.015
value_thr = 0.015
raise_thr = 0.015
noise = 0.005
pf_noise = 0.003
open_size = 0.15
hu_open_size = 0.15
raise_mult = 0.15

